# Render Blueprint for Polychain Capital
# Deploys the Next.js frontend + Express API as ONE web service. The database
# is hosted on Supabase (not Render) — set the Supabase connection strings in
# the following env vars.
services:
  - type: web
    name: polychain-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Fill these in from Supabase Dashboard -> Connect:
      #   DATABASE_URL  = transaction pooler connection string (port 6543)
      #   DIRECT_URL    = direct connection string (port 5432), used for schema push
      - key: DATABASE_URL
        value: postgresql://postgres.cdiixcacsyvtudxagzvn:Babyess_Tess@aws-0-eu-west-2.pooler.supabase.com:6543/postgres?pgbouncer=true
      - key: DIRECT_URL
        value: postgresql://postgres.cdiixcacsyvtudxagzvn:Babyess_Tess@aws-0-eu-west-2.pooler.supabase.com:5432/postgres?pgbouncer=true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_SEED
        value: "false"
      # Fill these in on Render after first deploy:
      # NEXT_PUBLIC_SITE_URL = https://<your-service>.onrender.com
      # ADMIN_EMAIL / ADMIN_PASSWORD = your admin login
      # USDT_TRC20_ADDRESS / BTC_ADDRESS / ETH_ADDRESS = deposit wallets
      # PAYSTACK_SECRET_KEY / PAYSTACK_USD_RATE = Paystack (optional)
      # MPESA_* = M-Pesa Daraja credentials (optional)
      # SMTP_HOST / SMTP_USER / SMTP_PASS = to send real verification emails
      - key: NEXT_PUBLIC_SITE_URL
        value: ""
      - key: ADMIN_EMAIL
        value: admin@polychaincapital.example
      - key: ADMIN_PASSWORD
        value: Admin@12345
